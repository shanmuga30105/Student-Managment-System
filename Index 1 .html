<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-weight: bold;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Add Student</h2>

        <form id="studentForm">

            <label for="name">Student Name</label>
            <input type="text" id="name"
                   placeholder="Enter student name" required>

            <label for="roll">Roll Number</label>
            <input type="text" id="roll"
                   placeholder="Enter roll number" required>

            <label for="course">Course</label>
            <input type="text" id="course"
                   placeholder="Enter course name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email"
                   placeholder="Enter email address" required>

            <button type="submit">Add Student</button>

        </form>

        <p id="message" role="status" aria-live="polite"></p>

    </div>

    <script src="add-student.js"></script>

</body>
</html>
